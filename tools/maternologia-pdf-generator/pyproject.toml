[project]
name = "maternologia-pdf-generator"
version = "0.1.0"
description = "Gerador local dos PDFs 100 Dias Sem Caos - O Passo a Passo"
readme = "README.md"
requires-python = "==3.13.14"
dependencies = [
  "beautifulsoup4==4.14.3",
  "jinja2==3.1.6",
  "markdown-it-py==4.0.0",
  "mdit-py-plugins==0.5.0",
  "pydantic==2.12.5",
  "pypdf==6.8.0",
  "pyyaml==6.0.3",
  "weasyprint==69.0",
]

[dependency-groups]
dev = [
  "pytest==9.0.2",
]

[project.scripts]
maternologia-pdf = "maternologia_pdf.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maternologia_pdf"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

